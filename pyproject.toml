[project]
name = "npc-service"
version = "0.3.0"
description = "NPC Service - AI-powered NPCs with persistent memory and RAG for games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # HTTP & API
    "httpx>=0.27.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",

    # CLI
    "rich>=13.0.0",
    "typer>=0.9.0",

    # RAG - Vector Database
    "qdrant-client>=1.7.0",

    # RAG - Optional Redis for production caching
    # "redis>=5.0.0",
]

[project.optional-dependencies]
rag = [
    "qdrant-client>=1.7.0",
]
redis = [
    "redis>=5.0.0",
]
all = [
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
]

[project.scripts]
npc-service = "src.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]
